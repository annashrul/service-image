## Render Blueprint for the standalone MiniPOS image embedding service.
## Connect this repository to Render as a Blueprint once, then pushes to main
## will rebuild and deploy the service automatically.
services:
  - type: web
    name: service-image
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    branch: main
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      - key: AI_MODEL_NAME
        value: "google/siglip-base-patch16-224"

      # Set this manually in the Render dashboard. Keep it identical to the
      # AI_SERVICE_TOKEN configured in the backend.
      - key: AI_SERVICE_TOKEN
        sync: false

      - key: AI_MAX_BATCH
        value: "32"

      - key: IMAGE_MAX_SIZE_MB
        value: "5"

      - key: AI_FETCH_TIMEOUT
        value: "15"

      - key: HF_HOME
        value: "/opt/hf"
